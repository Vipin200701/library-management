<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Members — Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body>

<div class="sidebar">
    <div class="brand"><i class="bi bi-building-fill"></i> LibraryOS</div>
    <div class="nav-label">Overview</div>
    <a href="index.html"   class="nav-link"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <div class="nav-label">Catalogue</div>
    <a href="books.html"   class="nav-link"><i class="bi bi-book"></i> Books</a>
    <a href="members.html" class="nav-link active"><i class="bi bi-people"></i> Members</a>
    <div class="nav-label">Circulation</div>
    <a href="borrow.html"  class="nav-link"><i class="bi bi-arrow-left-right"></i> Borrow / Return</a>
</div>

<div class="main-content">
    <div class="topbar">
        <h5><i class="bi bi-people me-2"></i>Members</h5>
        <div class="d-flex gap-2">
            <input type="text" id="searchInput" class="form-control form-control-sm"
                   placeholder="Search by name..." style="width:200px"
                   oninput="searchMembers(this.value)"/>
            <button class="btn btn-primary btn-sm" onclick="openAddModal()">
                <i class="bi bi-plus-lg me-1"></i>Add Member
            </button>
        </div>
    </div>

    <div class="card-box">
        <table class="table table-hover mb-0">
            <thead>
            <tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="membersTable">
            <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="memberModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Member</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="memberId"/>
                <div class="mb-3">
                    <label class="form-label">Name *</label>
                    <input type="text" id="name" class="form-control" placeholder="Full name"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email *</label>
                    <input type="email" id="email" class="form-control" placeholder="email@example.com"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" id="phone" class="form-control" placeholder="+91 XXXXX XXXXX"/>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary btn-sm" onclick="saveMember()">Save Member</button>
            </div>
        </div>
    </div>
</div>

<div id="toastContainer" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/members.js"></script>
</body>
</html>
