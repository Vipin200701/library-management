<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Books — Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body>

<div class="sidebar">
    <div class="brand"><i class="bi bi-building-fill"></i> LibraryOS</div>
    <div class="nav-label">Overview</div>
    <a href="index.html"   class="nav-link"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <div class="nav-label">Catalogue</div>
    <a href="books.html"   class="nav-link active"><i class="bi bi-book"></i> Books</a>
    <a href="members.html" class="nav-link"><i class="bi bi-people"></i> Members</a>
    <div class="nav-label">Circulation</div>
    <a href="borrow.html"  class="nav-link"><i class="bi bi-arrow-left-right"></i> Borrow / Return</a>
</div>

<div class="main-content">
    <div class="topbar">
        <h5><i class="bi bi-book me-2"></i>Books</h5>
        <div class="d-flex gap-2">
            <input type="text" id="searchInput" class="form-control form-control-sm"
                   placeholder="Search title or author..." style="width:220px"
                   oninput="searchBooks(this.value)"/>
            <button class="btn btn-primary btn-sm" onclick="openAddModal()">
                <i class="bi bi-plus-lg me-1"></i>Add Book
            </button>
        </div>
    </div>

    <div class="card-box">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>Title</th><th>Author</th><th>ISBN</th>
                <th>Genre</th><th>Total</th><th>Available</th>
                <th>Status</th><th>Actions</th>
            </tr>
            </thead>
            <tbody id="booksTable">
            <tr><td colspan="8" class="text-center text-muted">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="bookModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Book</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="bookId"/>
                <div class="mb-3">
                    <label class="form-label">Title *</label>
                    <input type="text" id="title" class="form-control" placeholder="Book title"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Author *</label>
                    <input type="text" id="author" class="form-control" placeholder="Author name"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">ISBN *</label>
                    <input type="text" id="isbn" class="form-control" placeholder="978-XXXXXXXXXX"/>
                </div>
                <div class="row">
                    <div class="col mb-3">
                        <label class="form-label">Genre</label>
                        <input type="text" id="genre" class="form-control" placeholder="e.g. Fiction"/>
                    </div>
                    <div class="col mb-3">
                        <label class="form-label">Published Year</label>
                        <input type="number" id="publishedYear" class="form-control" placeholder="2024"/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Total Copies *</label>
                    <input type="number" id="totalCopies" class="form-control" min="1" placeholder="1"/>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary btn-sm" onclick="saveBook()">Save Book</button>
            </div>
        </div>
    </div>
</div>

<div id="toastContainer" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/books.js"></script>
</body>
</html>
