<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Library Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="brand"><i class="bi bi-building-fill"></i> LibraryOS</div>
    <div class="nav-label">Overview</div>
    <a href="index.html"   class="nav-link active"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <div class="nav-label">Catalogue</div>
    <a href="books.html"   class="nav-link"><i class="bi bi-book"></i> Books</a>
    <a href="members.html" class="nav-link"><i class="bi bi-people"></i> Members</a>
    <div class="nav-label">Circulation</div>
    <a href="borrow.html"  class="nav-link"><i class="bi bi-arrow-left-right"></i> Borrow / Return</a>
</div>

<!-- Main -->
<div class="main-content">
    <div class="topbar">
        <h5><i class="bi bi-grid-1x2 me-2"></i>Dashboard</h5>
        <span id="dateLabel" class="text-muted" style="font-size:13px"></span>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card blue">
                <div class="stat-value" id="totalBooks">—</div>
                <div class="stat-label"><i class="bi bi-book me-1"></i>Total Books</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card green">
                <div class="stat-value" id="totalMembers">—</div>
                <div class="stat-label"><i class="bi bi-people me-1"></i>Total Members</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card amber">
                <div class="stat-value" id="totalBorrowed">—</div>
                <div class="stat-label"><i class="bi bi-arrow-left-right me-1"></i>Currently Borrowed</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card red">
                <div class="stat-value" id="totalOverdue">—</div>
                <div class="stat-label"><i class="bi bi-exclamation-triangle me-1"></i>Overdue</div>
            </div>
        </div>
    </div>

    <!-- Tables -->
    <div class="row g-3">
        <div class="col-md-6">
            <div class="card-box">
                <h6 class="fw-semibold mb-3"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Overdue Books</h6>
                <table class="table table-hover mb-0">
                    <thead><tr><th>Member</th><th>Book</th><th>Due Date</th></tr></thead>
                    <tbody id="overdueTable"><tr><td colspan="3" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card-box">
                <h6 class="fw-semibold mb-3"><i class="bi bi-clock-history text-primary me-2"></i>Recent Borrows</h6>
                <table class="table table-hover mb-0">
                    <thead><tr><th>Member</th><th>Book</th><th>Due Date</th></tr></thead>
                    <tbody id="recentTable"><tr><td colspan="3" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="toastContainer" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
